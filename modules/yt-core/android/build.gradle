apply plugin: 'com.android.library'

group = 'expo.modules.ytcore'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Simple helper that allows the root project to override versions declared by this library.
def safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.ytcore"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 26)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    versionCode 1
    versionName "0.1.0"
    multiDexEnabled true
  }

  lintOptions {
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  maven { url "https://jitpack.io" }
}

dependencies {
  implementation project(':expo-modules-core')
  // Same extraction engine as NewPipe / ViMusic / InnerTune.
  // When YouTube breaks extraction, bump this version and rebuild.
  api "com.github.TeamNewPipe:NewPipeExtractor:v0.26.5"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
