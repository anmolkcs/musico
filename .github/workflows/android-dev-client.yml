name: Android Dev-Client Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate native project
        run: npx expo prebuild -p android --no-install

      - name: Build dev-client debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload dev-client APK
        uses: actions/upload-artifact@v4
        with:
          name: musico-dev-client-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
